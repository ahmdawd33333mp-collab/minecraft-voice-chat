name: Build debug APK

# Builds the Android pilot in android/. No credentials, no deploy, no push.
# No Gradle wrapper is shipped in this pilot, so the workflow installs
# Gradle itself (see the setup-gradle step) instead of ./gradlew.
# If you copy only the android/ folder into its own repo, move this file to
# .github/workflows/build-apk.yml in that repo and remove "working-directory".
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voicechat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
